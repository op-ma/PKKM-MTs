function analisis(){

    row=i=>`<div onclick="bukaItem('${i[0]}')" class="flex gap-2 text-sm py-1 border-t cursor-pointer hover:bg-emerald-50"><span class="text-xs text-slate-400 w-12 shrink-0">${i[0]}</span><span class="flex-1">${E(i[1])}</span></div>`;

  <div class="bg-white rounded-xl shadow p-4 mt-3"><div class="flex justify-between text-sm mb-1"><b>Keseluruhan · ${lb(pT)}</b><span>${T.a.length} ada · ${T.b.length} belum · ${pT}%</span></div>${bar(pT)}</div>
  ${STRUKTUR.map(b=>{const it=b.s.flatMap(s=>s.i),r=st(it),p=pc(r.a.length,it.length);
  return `<section class="bg-white rounded-xl shadow mt-4 p-4"><div class="flex justify-between items-start gap-2"><h3 class="font-bold text-emerald-800">${b.k}. ${E(b.t)}</h3><span class="text-sm shrink-0 font-semibold">${p}% · ${lb(p)}</span></div>${bar(p)}

function prev(x){
  const u=String(x.url||'');if(!u)return null;let m;
  if(x.fileId)return{t:'f',src:`https://drive.google.com/file/d/${x.fileId}/preview`,open:`https://drive.google.com/file/d/${x.fileId}/view`};
  m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]+)/);
  if(m)return{t:'f',src:`https://drive.google.com/file/d/${m[1]}/preview`,open:`https://drive.google.com/file/d/${m[1]}/view`};
  m=u.match(/docs\.google\.com\/(document|spreadsheets|presentation)\/d\/([\w-]+)/);
  if(m){const v=`https://docs.google.com/${m[1]}/d/${m[2]}/preview`;return{t:'f',src:v,open:v};}
  m=u.match(/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([\w-]+)/);
  if(m)return{t:'f',src:`https://drive.google.com/embeddedfolderview?id=${m[1]}#list`,open:u};
  m=u.match(/(?:youtube\.com\/watch\?(?:[^#]*&)?v=|youtu\.be\/)([\w-]{6,})/);
  if(m)return{t:'f',src:`https://www.youtube.com/embed/${m[1]}`,open:u};
  if(/\.(jpe?g|png|gif|webp|svg)(\?|#|$)/i.test(u))return{t:'i',src:u,open:u};
  if(/\.(pdf|docx?|xlsx?|pptx?)(\?|#|$)/i.test(u))return{t:'f',src:'https://docs.google.com/viewer?embedded=true&url='+encodeURIComponent(u),open:u};
  return null;
}

async function siapFile(f){
  if(/^image\/(jpeg|png|webp)$/.test(f.type)&&f.size>600*1024){
    try{const m=await createImageBitmap(f),k=Math.min(1,1600/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=Math.round(m.width*k);c.height=Math.round(m.height*k);
    c.getContext('2d').drawImage(m,0,0,c.width,c.height);const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
    if(bl&&bl.size<f.size)return{name:f.name.replace(/\.\w+$/,'')+'.jpg',mime:'image/jpeg',data:await b64(bl)};}catch(e){}
  }
  return{name:f.name,mime:f.type||'application/octet-stream',data:await b64(f)};
}
function tambah(id){run(async()=>{
  const bt=$('bs'),fs=[...($('bf').files||[])],nama=$('bn').value.trim(),link=$('bl').value.trim(),teks=$('bt').value.trim();
  if(!fs.length&&!link&&!teks)throw new Error('Pilih file, isi link, atau tulis keterangan');
  const big=fs.find(f=>f.size>20*1048576);if(big)throw new Error('Ukuran file maksimal 20 MB: '+big.name);
  bt.disabled=true;let ok=0;const gagal=[];
  try{
    if(link||teks){bt.textContent='⏳ Menyimpan...';const j=await api({action:'addBukti',itemId:id,nama:fs.length?'':nama,link,teks});S.d.bukti.push(j.rec);S.vw=j.rec.id;ok++;}
    for(let i=0;i<fs.length;i++){
      bt.textContent=`⏳ Mengunggah ${i+1}/${fs.length}...`;
      try{const file=await siapFile(fs[i]),j=await api({action:'addBukti',itemId:id,nama:fs.length===1?nama:'',file});S.d.bukti.push(j.rec);S.vw=j.rec.id;ok++;}
      catch(e){gagal.push(fs[i].name+' ('+e.message+')');}
    }
  }finally{bt.disabled=false;bt.textContent='Simpan bukti';render();bukaItem(id);}
  if(gagal.length)alert(ok+' berhasil. Gagal:\n'+gagal.join('\n'));
});}
